[package]
name = "counterweave"
version = "0.1.0"
edition = "2024"
description = "Constraint-guided generative testing for whole systems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flyology-ada/counterweave"
rust-version = "1.85"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
